<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test — abris.json</title>
<style>
  @font-face{font-family:'Atkinson';src:url('https://fonts.gstatic.com/s/atkinsonhyperlegible/v11/9Bt23C1KxNDXMspQ1lPyU89-1h6ONRlW45GE5ZgpewSSbQ.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Atkinson';src:url('https://fonts.gstatic.com/s/atkinsonhyperlegible/v11/9Bt43C1KxNDXMspQ1lPyU89-1h6ONRlW45G055ItWQGCbUWn.woff2') format('woff2');font-weight:700;font-display:swap;}
  :root{--ink:#1A2238;--paper:#FBF7F0;--surface:#fff;--line:#E0D5C3;--brand:#5B3499;--muted:#6B6F80;--ok:#2E6F4E;--warn:#C8741A;--no:#A52A2A;}
  *{box-sizing:border-box;}
  body{font-family:'Atkinson',system-ui,sans-serif;background:var(--paper);color:var(--ink);margin:0 auto;padding:18px;line-height:1.4;max-width:760px;}
  h1{font-size:23px;margin:4px 0 2px;}
  .ey{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;}
  .status{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0 12px;font-size:15px;}
  .status b{font-size:22px;}
  .src{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;margin-left:6px;}
  .src-net{background:rgba(46,111,79,.15);color:var(--ok);}
  .src-cache{background:rgba(200,116,26,.15);color:var(--warn);}
  .open-now{margin-top:8px;font-weight:700;color:var(--ok);}
  .geo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .geo button{font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;border:none;border-radius:12px;padding:12px 16px;background:var(--brand);color:#fff;}
  .geo button.sec{background:#E9E2F3;color:var(--brand);}
  .geomsg{background:#E9E2F3;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px;}
  .geomsg .q{font-weight:700;margin-top:6px;}
  .near{background:rgba(46,111,79,.12);border:1px solid #b9d6c5;border-radius:14px;padding:14px 16px;margin-bottom:16px;}
  .near b{font-size:18px;}
  .grp-h{font-size:18px;font-weight:700;margin:22px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;}
  .grp-h span{color:var(--muted);font-weight:400;font-size:15px;}
  .ab{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .ab .nm{font-weight:700;font-size:17px;}
  .ab .meta{font-size:14px;color:var(--muted);margin-top:3px;}
  .ab .dist{font-weight:700;color:var(--brand);}
  .st{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:6px;}
  .st-open{background:rgba(46,111,79,.15);color:var(--ok);}
  .st-closed{background:rgba(165,42,42,.12);color:var(--no);}
  .st-garde{background:rgba(200,116,26,.15);color:var(--warn);}
  .st-unk{background:#EEE8DC;color:var(--muted);}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;margin:4px 6px 0 0;}
  .t-acc{background:rgba(46,111,79,.15);color:var(--ok);}
  .t-lim{background:rgba(200,116,26,.15);color:var(--warn);}
  .t-no{background:rgba(165,42,42,.12);color:var(--no);}
  .t-unk{background:#EEE8DC;color:var(--muted);}
  .t-info{background:#E9E2F3;color:var(--brand);}
  .err{background:#fdecea;border:1px solid #f5c2bc;color:#A52A2A;border-radius:12px;padding:16px;font-weight:700;}
</style>
</head>
<body>
  <div class="ey">Mon cap · page de test</div>
  <h1>abris.json · ouvert ? · le plus proche</h1>
  <div class="status" id="status">Chargement…</div>
  <div class="geo">
    <button id="btnGeo">📍 Trouver les plus proches</button>
    <button id="btnAll" class="sec" style="display:none">Revenir à la liste complète</button>
  </div>
  <div id="geomsg"></div>
  <div id="out"></div>

<script src="./opening_hours.js"></script>
<script>
  var KEY='moncap:abris';
  var ORDER=['pharmacy','metro','mall','library','townhall','community_centre','place_of_worship'];
  var LAST=null, POS=null;

  function fmtDate(iso){ try{return new Date(iso).toLocaleString('fr-BE',{dateStyle:'short',timeStyle:'short'});}catch(e){return iso||'—';} }
  function stripHolidays(s){ return s.split(';').filter(function(p){return !/^\s*(PH|SH)\b/.test(p);}).join(';').trim(); }
  function evalOH(v){ if(typeof opening_hours==='undefined')return null; try{return new opening_hours(stripHolidays(v)).getState(new Date());}catch(e){return null;} }
  function statusOf(a){
    if(a.dynamic_offhours){ if(a.opening_hours){var s=evalOH(a.opening_hours); if(s===true)return 'open'; if(s===false)return 'garde';} return 'unknown'; }
    if(!a.opening_hours)return 'unknown';
    var st=evalOH(a.opening_hours); if(st===true)return 'open'; if(st===false)return 'closed'; return 'unknown';
  }
  var STATUS={ open:{txt:'Ouvert maintenant',cls:'st-open',rank:0}, garde:{txt:'Hors horaires — voir pharmacie de garde',cls:'st-garde',rank:1}, unknown:{txt:'Horaire non renseigné',cls:'st-unk',rank:2}, closed:{txt:'Fermé maintenant',cls:'st-closed',rank:3} };
  function wheelchairTag(w){ if(w==='yes')return '<span class="tag t-acc">accessible</span>'; if(w==='limited')return '<span class="tag t-lim">accès limité</span>'; if(w==='no')return '<span class="tag t-no">non accessible</span>'; return '<span class="tag t-unk">accessibilité inconnue</span>'; }

  function distM(la1,lo1,la2,lo2){ var R=6371000,t=Math.PI/180; var dLa=(la2-la1)*t,dLo=(lo2-lo1)*t; var a=Math.pow(Math.sin(dLa/2),2)+Math.cos(la1*t)*Math.cos(la2*t)*Math.pow(Math.sin(dLo/2),2); return 2*R*Math.asin(Math.sqrt(a)); }
  function distLabel(d){ return d<1000 ? (Math.round(d/10)*10)+' m' : (d/1000).toFixed(1)+' km'; }
  function walkMin(d){ return Math.max(1, Math.round(d/75)); }

  function abCard(a, withDist){
    var s=STATUS[a._st], h='<div class="ab"><span class="st '+s.cls+'">'+s.txt+'</span>';
    if(withDist && a._d!=null) h+=' <span class="dist">· '+distLabel(a._d)+' · ≈ '+walkMin(a._d)+' min</span>';
    h+='<br><div class="nm">'+a.name+'</div>';
    if(a.opening_hours) h+='<div class="meta">'+a.opening_hours+'</div>';
    h+='<div>'+wheelchairTag(a.wheelchair);
    if(a.toilets) h+='<span class="tag t-info">toilettes</span>';
    h+='</div></div>'; return h;
  }

  function setStatus(payload, source){
    var open=(payload.abris||[]).filter(function(a){return a._st==='open';}).length;
    var sc=source==='réseau'?'src-net':'src-cache', sl=source==='réseau'?'réseau':'hors-ligne (dernière copie)';
    document.getElementById('status').innerHTML='<b>'+(payload.count||payload.abris.length)+'</b> abris · '+(payload.area||'')
      +'<br>à jour au '+fmtDate(payload.generated_at)+' <span class="src '+sc+'">'+sl+'</span>'
      +'<div class="open-now">● '+open+' ouverts maintenant</div>';
  }

  // Tri : par proximité si position connue, sinon par nom
  function sortFn(withDist){
    return function(x,y){ return withDist ? (x._d - y._d) : x.name.localeCompare(y.name); };
  }

  // Affichage unique : Ouverts → Pharmacies de garde → Horaire non renseigné (par catégorie) → fermés masqués
  function renderList(payload, source){
    var withDist = !!POS;
    var abris=(payload.abris||[]).map(function(a){
      a._st=statusOf(a);
      a._d = withDist ? distM(POS.lat,POS.lon,a.lat,a.lon) : null;
      return a;
    });
    setStatus(payload, source);

    var open   = abris.filter(function(a){return a._st==='open';}).sort(sortFn(withDist));
    var garde  = abris.filter(function(a){return a._st==='garde';}).sort(sortFn(withDist));
    var unknown= abris.filter(function(a){return a._st==='unknown';});
    var closedN= abris.filter(function(a){return a._st==='closed';}).length;

    var html='';

    // 1. Ouverts maintenant — à plat, par proximité
    html+='<div class="grp-h">Ouverts maintenant <span>· '+open.length+'</span></div>';
    if(open.length){ open.forEach(function(a){ html+=abCard(a,withDist); }); }
    else { html+='<div class="ab" style="text-align:center;color:var(--muted)">Aucun lieu ouvert pour l\'instant.</div>'; }

    // 2. Pharmacies de garde — bloc à part
    if(garde.length){
      html+='<div class="grp-h">Pharmacies — garde (hors horaires) <span>· '+garde.length+'</span></div>';
      garde.forEach(function(a){ html+=abCard(a,withDist); });
    }

    // 3. Horaire non renseigné — groupé par catégorie
    if(unknown.length){
      var groups={}; unknown.forEach(function(a){(groups[a.category]=groups[a.category]||[]).push(a);});
      var cats=ORDER.filter(function(c){return groups[c];}).concat(Object.keys(groups).filter(function(c){return ORDER.indexOf(c)<0;}));
      html+='<div class="grp-h" style="margin-top:26px">Horaire non renseigné</div>';
      cats.forEach(function(cat){
        var list=groups[cat].sort(sortFn(withDist));
        html+='<div class="grp-h" style="font-size:16px;border:none;margin:14px 0 6px">'+(list[0].label_fr||cat)+' <span>· '+list.length+'</span></div>';
        list.forEach(function(a){ html+=abCard(a,withDist); });
      });
    }

    // 4. Fermés — masqués (note discrète)
    if(closedN){
      html+='<div style="text-align:center;color:var(--muted);font-size:13px;margin-top:18px">'
        + closedN + (closedN>1?' lieux fermés masqués':' lieu fermé masqué') + '</div>';
    }

    document.getElementById('out').innerHTML=html;
    document.getElementById('btnAll').style.display = withDist ? '' : 'none';
  }

  // Repli humain quand la position manque — ne bloque jamais
  function geoFallback(msg){
    document.getElementById('geomsg').innerHTML='<div class="geomsg">'+msg
      +'<div class="q">À montrer à quelqu\'un : « Bonjour, je suis en difficulté. Pouvez-vous m\'aider, s\'il vous plaît ? »</div>'
      +'La liste complète reste disponible ci-dessous.</div>';
    if(LAST) renderList(LAST.payload, LAST.source);
  }

  document.getElementById('btnGeo').addEventListener('click', function(){
    if(!navigator.geolocation){ geoFallback('La localisation n\'est pas disponible sur cet appareil. '); return; }
    document.getElementById('geomsg').innerHTML='<div class="geomsg">Recherche de votre position…</div>';
    navigator.geolocation.getCurrentPosition(
      function(p){ POS={lat:p.coords.latitude,lon:p.coords.longitude}; document.getElementById('geomsg').innerHTML=''; if(LAST) renderList(LAST.payload, LAST.source); },
      function(err){ geoFallback('Position indisponible (refusée ou introuvable). '); },
      {enableHighAccuracy:false, timeout:10000, maximumAge:60000}
    );
  });
  document.getElementById('btnAll').addEventListener('click', function(){
    POS=null; document.getElementById('btnAll').style.display='none';
    if(LAST) renderList(LAST.payload, LAST.source);
  });

  function load(){
    fetch('./abris.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok)throw 0; return r.json(); })
      .then(function(d){ try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){} LAST={payload:d,source:'réseau'}; renderList(d,'réseau'); })
      .catch(function(){ var c=null; try{c=localStorage.getItem(KEY);}catch(e){} if(c){var d=JSON.parse(c); LAST={payload:d,source:'cache'}; renderList(d,'cache');} else { document.getElementById('status').innerHTML='<div class="err">Impossible de charger abris.json, et aucune copie enregistrée.</div>'; } });
  }
  load();
</script>
</body>
</html>
