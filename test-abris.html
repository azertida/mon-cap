<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test — abris.json</title>
<style>
  @font-face{font-family:'Atkinson';src:url('https://fonts.gstatic.com/s/atkinsonhyperlegible/v11/9Bt23C1KxNDXMspQ1lPyU89-1h6ONRlW45GE5ZgpewSSbQ.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Atkinson';src:url('https://fonts.gstatic.com/s/atkinsonhyperlegible/v11/9Bt43C1KxNDXMspQ1lPyU89-1h6ONRlW45G055ItWQGCbUWn.woff2') format('woff2');font-weight:700;font-display:swap;}
  :root{--ink:#1A2238;--paper:#FBF7F0;--surface:#fff;--line:#E0D5C3;--brand:#5B3499;--muted:#6B6F80;--ok:#2E6F4E;--warn:#C8741A;--no:#A52A2A;}
  *{box-sizing:border-box;}
  body{font-family:'Atkinson',system-ui,sans-serif;background:var(--paper);color:var(--ink);margin:0 auto;padding:18px;line-height:1.4;max-width:760px;}
  h1{font-size:24px;margin:4px 0 2px;}
  .ey{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;}
  .status{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0 22px;font-size:15px;}
  .status b{font-size:22px;}
  .status .src{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;margin-left:6px;}
  .src-net{background:rgba(46,111,79,.15);color:var(--ok);}
  .src-cache{background:rgba(200,116,26,.15);color:var(--warn);}
  .open-now{margin-top:8px;font-weight:700;color:var(--ok);}
  .grp-h{font-size:18px;font-weight:700;margin:22px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;}
  .grp-h span{color:var(--muted);font-weight:400;font-size:15px;}
  .ab{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .ab .nm{font-weight:700;font-size:17px;}
  .ab .meta{font-size:14px;color:var(--muted);margin-top:3px;}
  .st{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:6px;}
  .st-open{background:rgba(46,111,79,.15);color:var(--ok);}
  .st-closed{background:rgba(165,42,42,.12);color:var(--no);}
  .st-garde{background:rgba(200,116,26,.15);color:var(--warn);}
  .st-unk{background:#EEE8DC;color:var(--muted);}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;margin:4px 6px 0 0;}
  .t-acc{background:rgba(46,111,79,.15);color:var(--ok);}
  .t-lim{background:rgba(200,116,26,.15);color:var(--warn);}
  .t-no{background:rgba(165,42,42,.12);color:var(--no);}
  .t-unk{background:#EEE8DC;color:var(--muted);}
  .t-info{background:#E9E2F3;color:var(--brand);}
  .err{background:#fdecea;border:1px solid #f5c2bc;color:#A52A2A;border-radius:12px;padding:16px;font-weight:700;}
</style>
</head>
<body>
  <div class="ey">Mon cap · page de test</div>
  <h1>Lecture de abris.json + « ouvert maintenant ? »</h1>
  <div class="status" id="status">Chargement…</div>
  <div id="out"></div>

<script src="./opening_hours.js"></script>
<script>
  var KEY = 'moncap:abris';
  var ORDER = ['pharmacy','metro','mall','library','townhall','community_centre','place_of_worship'];

  function fmtDate(iso){
    try { return new Date(iso).toLocaleString('fr-BE',{dateStyle:'short',timeStyle:'short'}); }
    catch(e){ return iso || '—'; }
  }

  // On retire les règles jours fériés (PH/SH) : traités comme jours normaux pour l'instant.
  function stripHolidays(s){
    return s.split(';').filter(function(p){ return !/^\s*(PH|SH)\b/.test(p); }).join(';').trim();
  }
  // Évalue l'état d'ouverture maintenant. Renvoie true / false / null (non lisible).
  function evalOH(value){
    if(typeof opening_hours === 'undefined') return null;
    try {
      var oh = new opening_hours(stripHolidays(value));
      return oh.getState(new Date());
    } catch(e){ return null; }
  }
  // Statut d'un abri : open / closed / garde / unknown
  function statusOf(a){
    if(a.dynamic_offhours){           // pharmacies : garde tournante hors horaires réguliers
      if(a.opening_hours){
        var s = evalOH(a.opening_hours);
        if(s===true) return 'open';
        if(s===false) return 'garde';
      }
      return 'unknown';               // horaire régulier inconnu -> pas de promesse
    }
    if(!a.opening_hours) return 'unknown';
    var st = evalOH(a.opening_hours);
    if(st===true) return 'open';
    if(st===false) return 'closed';
    return 'unknown';                 // non lisible -> pas de promesse
  }
  var STATUS = {
    open:   {txt:'Ouvert maintenant',                      cls:'st-open',   rank:0},
    garde:  {txt:'Hors horaires — voir pharmacie de garde',cls:'st-garde',  rank:1},
    unknown:{txt:'Horaire non renseigné',                  cls:'st-unk',    rank:2},
    closed: {txt:'Fermé maintenant',                       cls:'st-closed', rank:3}
  };

  function wheelchairTag(w){
    if(w==='yes')    return '<span class="tag t-acc">accessible</span>';
    if(w==='limited')return '<span class="tag t-lim">accès limité</span>';
    if(w==='no')     return '<span class="tag t-no">non accessible</span>';
    return '<span class="tag t-unk">accessibilité inconnue</span>';
  }

  function render(payload, source){
    var abris = (payload.abris||[]).map(function(a){ a._st = statusOf(a); return a; });
    var openCount = abris.filter(function(a){return a._st==='open';}).length;

    var st = document.getElementById('status');
    var srcClass = source==='réseau' ? 'src-net' : 'src-cache';
    var srcLabel = source==='réseau' ? 'réseau' : 'hors-ligne (dernière copie)';
    st.innerHTML = '<b>'+(payload.count||abris.length)+'</b> abris · '+(payload.area||'')
      + '<br>à jour au ' + fmtDate(payload.generated_at)
      + ' <span class="src '+srcClass+'">'+srcLabel+'</span>'
      + '<div class="open-now">● '+openCount+' ouverts maintenant'
      + ' <span style="color:var(--muted);font-weight:400">('+fmtDate(new Date().toISOString())+')</span></div>';

    var groups = {};
    abris.forEach(function(a){ (groups[a.category]=groups[a.category]||[]).push(a); });
    var cats = ORDER.filter(function(c){return groups[c];})
      .concat(Object.keys(groups).filter(function(c){return ORDER.indexOf(c)<0;}));

    var html = '';
    cats.forEach(function(cat){
      var list = groups[cat].sort(function(x,y){
        return (STATUS[x._st].rank - STATUS[y._st].rank) || x.name.localeCompare(y.name);
      });
      html += '<div class="grp-h">'+(list[0].label_fr||cat)+' <span>· '+list.length+'</span></div>';
      list.forEach(function(a){
        var s = STATUS[a._st];
        html += '<div class="ab">';
        html += '<span class="st '+s.cls+'">'+s.txt+'</span><br>';
        html += '<div class="nm">'+a.name+'</div>';
        if(a.opening_hours) html += '<div class="meta">'+a.opening_hours+'</div>';
        html += '<div>'+wheelchairTag(a.wheelchair);
        if(a.toilets) html += '<span class="tag t-info">toilettes</span>';
        html += '</div></div>';
      });
    });
    document.getElementById('out').innerHTML = html;
  }

  function load(){
    fetch('./abris.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data){
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){}
        render(data, 'réseau');
      })
      .catch(function(){
        var cached = null;
        try { cached = localStorage.getItem(KEY); } catch(e){}
        if(cached){ render(JSON.parse(cached), 'cache'); }
        else { document.getElementById('status').innerHTML =
          '<div class="err">Impossible de charger abris.json, et aucune copie enregistrée. Connecte-toi une première fois.</div>'; }
      });
  }
  load();
</script>
</body>
</html>
